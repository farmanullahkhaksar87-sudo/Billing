<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نیو قاری ہوزری سٹور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        @font-face {
            font-family: 'Jameel Noori Nastaleeq';
            src: url('https://font.urdufonts.net/download.php?id=jameel-noori-nastaleeq-regular') format('truetype');
        }
        /* ان پٹ خانوں کو واضح کرنے کے لیے سٹائل */
        body, input, select, button, span, th, td, h1, p, h2, label {
            font-family: 'Jameel Noori Nastaleeq', serif !important;
        }
        input, select {
            color: #000000 !important; /* لکھائی کا رنگ کالا */
            font-size: 18px !important; /* لکھائی کا سائز بڑا */
            font-weight: bold !important;
            border: 2px solid #6366f1 !important; /* بارڈر کو نمایاں کیا */
        }
        ::placeholder { color: #64748b !important; }
        
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; }
        }
    </style>
</head>
<body class="bg-slate-100 p-4">

    <!-- ہیڈر -->
    <header class="bg-indigo-700 text-white p-6 rounded-2xl text-center mb-6 no-print">
        <h1 class="text-3xl font-bold">نیو قاری ہوزری سٹور</h1>
    </header>

    <!-- انٹری سیکشن -->
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-2xl border mb-6 no-print">
        <h2 class="text-xl mb-4 font-bold text-slate-800">تفصیل درج کریں</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <input type="text" id="custNameInput" placeholder="کسٹمر کا نام" class="w-full p-4 rounded-xl outline-none col-span-2">
            
            <select id="itemName" class="w-full p-4 rounded-xl outline-none">
                <option value="">پروڈکٹ منتخب کریں</option>
                <option value="مردانہ جراب">مردانہ جراب</option>
                <option value="لیڈی جراب">لیڈی جراب</option>
                <option value="بچہ جراب">بچہ جراب</option>
                <option value="موزہ">موزہ</option>
                <option value="ٹوپی">ٹوپی</option>
                <option value="دستانہ">دستانہ</option>
                <option value="ہائی نیک">ہائی نیک</option>
                <option value="پاجامہ">پاجامہ</option>
                <option value="بنیان">بنیان</option>
            </select>
            
            <input type="text" id="itemDetails" placeholder="مزید معلومات" class="w-full p-4 rounded-xl outline-none">
            <input type="number" id="itemQty" placeholder="تعداد" class="w-full p-4 rounded-xl outline-none">
            <input type="number" id="itemPrice" placeholder="قیمت" class="w-full p-4 rounded-xl outline-none">
            
            <button onclick="addItem()" class="bg-indigo-600 text-white py-4 rounded-xl hover:bg-indigo-700 col-span-2 font-bold text-lg">آئٹم شامل کریں</button>
            
            <!-- کسٹمر کھاتہ -->
            <input type="number" id="prevBalance" placeholder="سابقہ بقایا" class="w-full p-4 rounded-xl outline-none border-red-500" oninput="calculateTotal()">
            <input type="number" id="paidAmount" placeholder="جمع شدہ رقم" class="w-full p-4 rounded-xl outline-none border-green-500" oninput="calculateTotal()">
        </div>
    </div>

    <!-- بل -->
    <div id="bill-container" class="max-w-2xl mx-auto bg-white p-6 rounded-2xl border">
        <h2 class="text-2xl font-bold text-center mb-4">نیو قاری ہوزری سٹور</h2>
        <div class="text-right font-bold mb-4">کسٹمر: <span id="displayCustName">-------</span></div>
        <table class="w-full border-collapse text-center">
            <thead class="bg-slate-100">
                <tr><th class="p-2 border">آئٹم</th><th class="p-2 border">تعداد</th><th class="p-2 border">قیمت</th><th class="p-2 border">کل</th></tr>
            </thead>
            <tbody id="cartTable"></tbody>
        </table>
        <div class="mt-4 pt-2 border-t text-lg font-bold">
            <p>سب ٹوٹل: <span id="subTotalDisplay">0</span></p>
            <p>سابقہ بقایا: <span id="prevBalanceDisplay">0</span></p>
            <p>جمع شدہ: <span id="paidAmountDisplay">0</span></p>
            <p class="text-xl mt-2 text-indigo-700">ٹوٹل بقایا: <span id="grandTotal">0</span></p>
        </div>
    </div>

    <script>
        let subTotal = 0;
        function addItem() {
            const custName = document.getElementById('custNameInput').value;
            const item = document.getElementById('itemName').value;
            const det = document.getElementById('itemDetails').value;
            const qty = parseInt(document.getElementById('itemQty').value);
            const price = parseInt(document.getElementById('itemPrice').value);
            
            if(custName) document.getElementById('displayCustName').innerText = custName;
            if(item && qty && price) {
                let total = qty * price;
                subTotal += total;
                document.getElementById('cartTable').innerHTML += `<tr><td class="p-2 border">${item} ${det}</td><td class="p-2 border">${qty}</td><td class="p-2 border">${price}</td><td class="p-2 border">${total}</td></tr>`;
                document.getElementById('subTotalDisplay').innerText = subTotal;
                calculateTotal();
            }
        }
        function calculateTotal() {
            const prev = parseInt(document.getElementById('prevBalance').value) || 0;
            const paid = parseInt(document.getElementById('paidAmount').value) || 0;
            document.getElementById('prevBalanceDisplay').innerText = prev;
            document.getElementById('paidAmountDisplay').innerText = paid;
            document.getElementById('grandTotal').innerText = (subTotal + prev) - paid;
        }
    </script>
</body>
</html>
