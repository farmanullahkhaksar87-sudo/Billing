<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نیو قاری ہوزری سٹور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* ان پٹ خانوں کے لیے سٹینڈرڈ فونٹ تاکہ لکھائی ہر حال میں نظر آئے */
        input, select {
            font-family: sans-serif !important; 
            font-size: 16px !important;
            color: #000000 !important;
            background-color: #ffffff !important;
            border: 2px solid #4f46e5 !important;
            padding: 12px !important;
            display: block !important;
            width: 100% !important;
        }
    </style>
</head>
<body class="bg-gray-100 p-4">

    <!-- انٹری سیکشن -->
    <div class="max-w-md mx-auto bg-white p-5 rounded-lg shadow-md mb-6">
        <h2 class="text-xl font-bold mb-4">انٹری فارم</h2>
        
        <div class="space-y-4">
            <input type="text" id="custNameInput" placeholder="کسٹمر کا نام">
            
            <select id="itemName">
                <option value="">پروڈکٹ منتخب کریں</option>
                <option value="مردانہ جراب">مردانہ جراب</option>
                <option value="لیڈی جراب">لیڈی جراب</option>
                <option value="بچہ جراب">بچہ جراب</option>
                <option value="موزہ">موزہ</option>
                <option value="بنیان">بنیان</option>
            </select>
            
            <input type="number" id="itemQty" placeholder="تعداد (یہاں لکھیں)">
            <input type="number" id="itemPrice" placeholder="قیمت (یہاں لکھیں)">
            
            <button onclick="addItem()" class="w-full bg-blue-600 text-white py-3 rounded font-bold">آئٹم شامل کریں</button>
            
            <div class="border-t pt-4 mt-4">
                <input type="number" id="prevBalance" placeholder="سابقہ بقایا (یہاں لکھیں)" oninput="calculateTotal()">
                <input type="number" id="paidAmount" placeholder="جمع شدہ رقم (یہاں لکھیں)" oninput="calculateTotal()" class="mt-2">
            </div>
        </div>
    </div>

    <!-- بل -->
    <div id="bill-container" class="max-w-md mx-auto bg-white p-5 rounded-lg shadow-md">
        <h2 class="text-center font-bold text-xl">نیو قاری ہوزری سٹور</h2>
        <div class="mt-4">کسٹمر: <span id="displayCustName">-------</span></div>
        <table class="w-full mt-4 border">
            <thead><tr class="bg-gray-200"><th>آئٹم</th><th>تعداد</th><th>کل</th></tr></thead>
            <tbody id="cartTable" class="text-center"></tbody>
        </table>
        <div class="mt-4 border-t pt-2">
            <p>سب ٹوٹل: <span id="subTotalDisplay">0</span></p>
            <p>سابقہ بقایا: <span id="prevBalanceDisplay">0</span></p>
            <p>جمع شدہ: <span id="paidAmountDisplay">0</span></p>
            <p class="font-bold text-lg">ٹوٹل بقایا: <span id="grandTotal">0</span></p>
        </div>
    </div>

    <script>
        let subTotal = 0;
        function addItem() {
            const name = document.getElementById('custNameInput').value;
            const item = document.getElementById('itemName').value;
            const qty = parseFloat(document.getElementById('itemQty').value) || 0;
            const price = parseFloat(document.getElementById('itemPrice').value) || 0;
            
            if(name) document.getElementById('displayCustName').innerText = name;
            
            if(item && qty > 0 && price > 0) {
                let total = qty * price;
                subTotal += total;
                document.getElementById('cartTable').innerHTML += `<tr><td>${item}</td><td>${qty}</td><td>${total}</td></tr>`;
                document.getElementById('subTotalDisplay').innerText = subTotal;
                calculateTotal();
            } else {
                alert("براہ کرم تعداد اور قیمت درست درج کریں");
            }
        }

        function calculateTotal() {
            const prev = parseFloat(document.getElementById('prevBalance').value) || 0;
            const paid = parseFloat(document.getElementById('paidAmount').value) || 0;
            document.getElementById('prevBalanceDisplay').innerText = prev;
            document.getElementById('paidAmountDisplay').innerText = paid;
            document.getElementById('grandTotal').innerText = (subTotal + prev) - paid;
        }
    </script>
</body>
</html>
