<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نیو قاری ہوزری سٹور - بلنگ سسٹم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        @font-face {
            font-family: 'Jameel Noori Nastaleeq';
            src: url('https://font.urdufonts.net/download.php?id=jameel-noori-nastaleeq-regular') format('truetype');
            font-display: swap;
        }
        body, input, select, button, span, th, td, h1, p, h2, label, textarea {
            font-family: 'Jameel Noori Nastaleeq', serif !important;
        }
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; }
        }
    </style>
</head>
<body class="bg-slate-50 p-4">

    <!-- ہیڈر -->
    <header class="bg-indigo-700 text-white p-6 rounded-2xl shadow-lg text-center mb-6 no-print">
        <h1 class="text-3xl font-bold">نیو قاری ہوزری سٹور</h1>
        <p>قائد اعظم مارکیٹ، فیصل آباد | فون: 03065378112</p>
    </header>

    <!-- انٹری سیکشن -->
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-2xl shadow-sm border mb-6 no-print">
        <h2 class="text-xl mb-4 font-bold">نئی انٹری درج کریں</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <input type="text" id="custNameInput" placeholder="کسٹمر کا نام" class="w-full p-3 border rounded-xl outline-none col-span-2">
            
            <select id="itemName" class="w-full p-3 border rounded-xl outline-none bg-white">
                <option value="">پروڈکٹ منتخب کریں</option>
                <option value="مردانہ جراب">مردانہ جراب</option>
                <option value="لیڈی جراب">لیڈی جراب</option>
                <option value="بچہ جراب">بچہ جراب</option>
                <option value="مردانہ جراب چائنا">مردانہ جراب چائنا</option>
                <option value="لیڈی جراب چائنا">لیڈی جراب چائنا</option>
                <option value="بچہ جراب چائنا">بچہ جراب چائنا</option>
                <option value="موزہ">موزہ</option>
                <option value="موزہ چائنا">موزہ چائنا</option>
                <option value="ٹوپی">ٹوپی</option>
                <option value="دستانہ">دستانہ</option>
                <option value="ہائی نیک">ہائی نیک</option>
                <option value="پاجامہ">پاجامہ</option>
                <option value="کیپ">کیپ</option>
                <option value="رومال">رومال</option>
                <option value="ناڑہ">ناڑہ</option>
                <option value="پرنہ">پرنہ</option>
                <option value="بنیان">بنیان</option>
            </select>

            <!-- مزید معلومات کا خانہ -->
            <input type="text" id="itemDetails" placeholder="مزید معلومات یا نیا پروڈکٹ" class="w-full p-3 border rounded-xl outline-none">
            
            <input type="number" id="itemQty" placeholder="تعداد" class="w-full p-3 border rounded-xl outline-none">
            <input type="number" id="itemPrice" placeholder="قیمت" class="w-full p-3 border rounded-xl outline-none">
            <button onclick="addItem()" class="bg-indigo-600 text-white py-3 rounded-xl hover:bg-indigo-700 col-span-2">شامل کریں</button>
        </div>
    </div>

    <!-- بل سیکشن -->
    <div id="bill-container" class="max-w-2xl mx-auto bg-white p-6 rounded-2xl shadow-sm border">
        <div class="text-center mb-6 border-b pb-4">
            <h2 class="text-2xl font-bold">نیو قاری ہوزری سٹور</h2>
            <p>قائد اعظم مارکیٹ، فیصل آباد</p>
            <p>فون: 03065378112</p>
            <div class="mt-2 text-right font-bold">کسٹمر کا نام: <span id="displayCustName">-------</span></div>
        </div>
        
        <table class="w-full border-collapse text-center">
            <thead>
                <tr class="border-b">
                    <th class="p-2 text-right">آئٹم کی تفصیل</th>
                    <th class="p-2">تعداد</th>
                    <th class="p-2">قیمت</th>
                    <th class="p-2">کل</th>
                </tr>
            </thead>
            <tbody id="cartTable"></tbody>
        </table>
        
        <div class="mt-6 pt-4 border-t text-xl font-bold text-left">
            گرانڈ ٹوٹل: <span id="grandTotal">0</span> روپے
        </div>
    </div>

    <div class="max-w-2xl mx-auto mt-6 no-print grid grid-cols-2 gap-4">
        <button onclick="window.print()" class="bg-emerald-600 text-white py-3 rounded-xl hover:bg-emerald-700">پرنٹ کریں</button>
        <button onclick="downloadBillImage()" class="bg-pink-600 text-white py-3 rounded-xl hover:bg-pink-700">بل کی تصویر بنائیں</button>
    </div>

    <script>
        let total = 0;
        function addItem() {
            const custName = document.getElementById('custNameInput').value;
            const selectName = document.getElementById('itemName').value;
            const extraDetails = document.getElementById('itemDetails').value;
            const qty = document.getElementById('itemQty').value;
            const price = document.getElementById('itemPrice').value;
            
            if(custName) document.getElementById('displayCustName').innerText = custName;
            
            // اگر منتخب کردہ نام اور مزید معلومات دونوں ہیں تو انہیں جوڑ دیں
            const finalItemName = selectName + (extraDetails ? " (" + extraDetails + ")" : "");
            
            if((selectName || extraDetails) && qty && price) {
                const subTotal = qty * price;
                total += subTotal;
                
                const row = `<tr>
                    <td class="p-2 border-b text-right">${finalItemName}</td>
                    <td class="p-2 border-b">${qty}</td>
                    <td class="p-2 border-b">${price}</td>
                    <td class="p-2 border-b">${subTotal}</td>
                </tr>`;
                
                document.getElementById('cartTable').innerHTML += row;
                document.getElementById('grandTotal').innerText = total;
                
                // فیلڈز کو صاف کریں
                document.getElementById('itemDetails').value = '';
                document.getElementById('itemQty').value = '';
                document.getElementById('itemPrice').value = '';
            }
        }

        function downloadBillImage() {
            const billElement = document.getElementById('bill-container');
            html2canvas(billElement).then(canvas => {
                const link = document.createElement('a');
                link.download = 'New-Qari-Hosiery-Bill.png';
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        }
    </script>
</body>
</html>
