<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نیو قاری ہوزری سٹور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input { font-size: 16px !important; color: #000 !important; border: 2px solid #333 !important; padding: 10px !important; width: 100% !important; margin-top: 5px !important; }
    </style>
</head>
<body class="bg-gray-100 p-2">

    <div class="max-w-md mx-auto bg-white p-4 rounded shadow">
        <h2 class="text-lg font-bold mb-2">تفصیل درج کریں</h2>
        
        <input type="text" id="custNameInput" placeholder="کسٹمر کا نام">
        <input type="number" id="itemQty" placeholder="تعداد">
        <input type="number" id="itemPrice" placeholder="قیمت">
        <button onclick="addItem()" class="w-full bg-blue-600 text-white py-2 mt-3 font-bold">آئٹم شامل کریں</button>
        
        <div class="mt-4 border-t pt-2">
            <input type="number" id="prevBalance" placeholder="سابقہ بقایا" oninput="calculateTotal()">
            <input type="number" id="paidAmount" placeholder="جمع شدہ رقم" oninput="calculateTotal()">
        </div>
    </div>

    <div id="bill-container" class="max-w-md mx-auto bg-white p-4 rounded shadow mt-4">
        <h2 class="text-center font-bold">نیو قاری ہوزری سٹور</h2>
        <div class="mt-2">کسٹمر: <span id="displayCustName">-------</span></div>
        <table class="w-full mt-2 border text-sm">
            <tr class="bg-gray-200"><th>آئٹم</th><th>تعداد</th><th>کل</th></tr>
            <tbody id="cartTable" class="text-center"></tbody>
        </table>
        <div class="mt-2 border-t pt-1 text-sm">
            <p>سابقہ بقایا: <span id="prevBalanceDisplay">0</span></p>
            <p>جمع شدہ: <span id="paidAmountDisplay">0</span></p>
            <p class="font-bold">ٹوٹل بقایا: <span id="grandTotal">0</span></p>
        </div>
    </div>

    <script>
        let subTotal = 0;
        function addItem() {
            const name = document.getElementById('custNameInput').value;
            const qty = parseFloat(document.getElementById('itemQty').value) || 0;
            const price = parseFloat(document.getElementById('itemPrice').value) || 0;
            if(name) document.getElementById('displayCustName').innerText = name;
            if(qty > 0 && price > 0) {
                let total = qty * price;
                subTotal += total;
                document.getElementById('cartTable').innerHTML += `<tr><td>آئٹم</td><td>${qty}</td><td>${total}</td></tr>`;
                calculateTotal();
            }
        }
        function calculateTotal() {
            const prev = parseFloat(document.getElementById('prevBalance').value) || 0;
            const paid = parseFloat(document.getElementById('paidAmount').value) || 0;
            document.getElementById('prevBalanceDisplay').innerText = prev;
            document.getElementById('paidAmountDisplay').innerText = paid;
            document.getElementById('grandTotal').innerText = (subTotal + prev) - paid;
        }
    </script>
</body>
</html>
