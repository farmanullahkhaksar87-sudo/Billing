<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نیو قاری ہوزری سٹور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, get, child, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDw27sGFr6hu8MFhKLhYbNz6UDr9drTwHY",
            authDomain: "billing-calculator-518b6.firebaseapp.com",
            projectId: "billing-calculator-518b6",
            storageBucket: "billing-calculator-518b6.firebasestorage.app",
            messagingSenderId: "565720164322",
            appId: "1:565720164322:web:1db79154b08e2bc4b57bbb",
            databaseURL: "https://billing-calculator-518b6-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.db = db;
        window.dbRef = ref(db);
        window.push = push;
        window.set = set;
        window.get = get;
        window.child = child;
        window.ref = ref;
        window.onValue = onValue;
    </script>

    <style>
        input, select { font-size: 16px !important; color: #000 !important; border: 2px solid #333 !important; padding: 10px !important; width: 100% !important; margin-top: 5px !important; }
        
        /* پرنٹ کے لیے خصوصی سیٹنگز */
        @media print {
            body { background: white !important; padding: 0 !important; margin: 0 !important; }
            .no-print { display: none !important; } /* بل کے علاوہ باقی تمام حصے چھپ جائیں گے */
            #bill-container { 
                box-shadow: none !important; 
                border: none !important; 
                width: 100% !important; 
                max-width: 100% !important; 
                padding: 0 !important; 
                margin: 0 !important; 
            }
        }
    </style>
</head>
<body class="bg-gray-100 p-2 pb-20">

    <!-- بل کا حصہ (صرف یہی پرنٹ ہوگا) -->
    <div id="bill-container" class="max-w-md mx-auto bg-white p-4 rounded shadow">
        <h2 class="text-center font-bold text-xl">نیو قاری ہوزری سٹور</h2>
        <div class="mt-2">کسٹمر: <span id="displayCustName">-------</span></div>
        <table class="w-full mt-2 border text-sm text-center">
            <thead>
                <tr class="bg-gray-200"><th>آئٹم / تفصیل</th><th>تعداد</th><th>قیمت</th><th>کل</th></tr>
            </thead>
            <tbody id="cartTable"></tbody>
        </table>
        <div class="mt-2 border-t pt-1 text-sm">
            <p>سب ٹوٹل: <span id="subTotalDisplay">0</span></p>
            <p>سابقہ بقایا: <span id="prevBalanceDisplay">0</span></p>
            <p>جمع شدہ: <span id="paidAmountDisplay">0</span></p>
            <p class="font-bold text-lg">ٹوٹل بقایا: <span id="grandTotal">0</span></p>
        </div>
    </div>

    <!-- انٹری کا حصہ (پرنٹ میں نہیں آئے گا) -->
    <div class="max-w-md mx-auto bg-white p-4 rounded shadow mt-4 no-print">
        <input type="text" id="custNameInput" placeholder="کسٹمر کا نام" onchange="fetchCustomerPreviousBalance()">
        
        <select id="itemName">
            <option value="">پروڈکٹ منتخب کریں</option>
            <option value="مردانہ جراب">مردانہ جراب</option>
            <option value="لیڈی جراب">لیڈی جراب</option>
            <option value="بچہ جراب">بچہ جراب</option>
            <option value="مردانہ جراب چائنا">مردانہ جراب چائنا</option>
            <option value="لیڈی جراب چائنا">لیڈی جراب چائنا</option>
            <option value="بچہ جراب چائنا">بچہ جراب چائنا</option>
            <option value="موزہ">موزہ</option>
            <option value="موزہ چائنا">موزہ چائنا</option>
            <option value="ٹوپی">ٹوپی</option>
            <option value="دستانہ">دستانہ</option>
            <option value="ہائی نیک">ہائی نیک</option>
            <option value="پاجامہ">پاجامہ</option>
            <option value="کیپ">کیپ</option>
            <option value="رومال">رومال</option>
            <option value="ناڑہ">ناڑہ</option>
            <option value="پرنہ">پرنہ</option>
            <option value="بنیان">بنیان</option>
        </select>

        <input type="text" id="itemDetail" placeholder="سب کیٹیگری / سائز / مزید تفصیل (مثلاً: کاٹن، لارج، ڈبل)">

        <input type="number" id="itemQty" placeholder="تعداد">
        <input type="number" id="itemPrice" placeholder="قیمت">
        <button onclick="addItem()" class="w-full bg-blue-600 text-white py-2 mt-3 font-bold">آئٹم شامل کریں</button>
        
        <input type="number" id="prevBalance" placeholder="سابقہ بقایا" oninput="calculateTotal()">
        <input type="number" id="paidAmount" placeholder="جمع شدہ رقم" oninput="calculateTotal()">
        
        <button onclick="saveBillToFirebase()" class="w-full bg-purple-600 text-white py-2 mt-3 font-bold">بل محفوظ کریں (Firebase)</button>
    </div>

    <!-- پرنٹ اور واٹس ایپ بٹنز (پرنٹ میں نہیں آئیں گے) -->
    <div class="max-w-md mx-auto mt-4 grid grid-cols-2 gap-2 no-print">
        <button onclick="window.print()" class="bg-green-600 text-white py-2 rounded font-bold">پرنٹ کریں</button>
        <button onclick="downloadBillImage()" class="bg-pink-600 text-white py-2 rounded font-bold">واٹس ایپ تصویر</button>
    </div>

    <!-- سابقہ بلوں کا ریکارڈ اور رپورٹ کا سیکشن (پرنٹ میں نہیں آئے گا) -->
    <div class="max-w-md mx-auto bg-white p-4 rounded shadow mt-6 no-print">
        <h3 class="text-lg font-bold text-center border-b pb-2 mb-3">سابقہ بلوں کا ریکارڈ اور رپورٹ</h3>

        <div class="grid grid-cols-2 gap-2 mb-4 text-center">
            <div class="bg-green-100 border border-green-400 p-2 rounded">
                <p class="text-xs text-gray-600 font-bold">کل سیل (Total Sales)</p>
                <p id="totalSalesDisplay" class="text-lg font-bold text-green-700">Rs. 0</p>
            </div>
            <div class="bg-blue-100 border border-blue-400 p-2 rounded">
                <p class="text-xs text-gray-600 font-bold">کل وصول شدہ رقم</p>
                <p id="totalPaidDisplay" class="text-lg font-bold text-blue-700">Rs. 0</p>
            </div>
        </div>
        
        <input type="text" id="searchInput" placeholder="کسٹمر کے نام سے تلاش کریں..." onkeyup="filterBills()" class="mb-3">

        <div class="overflow-x-auto">
            <table class="w-full border text-xs text-center">
                <thead>
                    <tr class="bg-gray-700 text-white">
                        <th class="p-2">تاریخ</th>
                        <th class="p-2">کسٹمر</th>
                        <th class="p-2">سیل</th>
                        <th class="p-2">بقایا</th>
                        <th class="p-2">تفصیلات</th>
                    </tr>
                </thead>
                <tbody id="reportsTable">
                    <tr><td colspan="5" class="p-2 text-gray-500">ریکارڈ لوڈ ہو رہا ہے...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let subTotal = 0;
        let cartItems = [];
        let allBillsData = [];

        window.onload = function() {
            setTimeout(loadBillsFromFirebase, 1000);
        };

        function addItem() {
            const name = document.getElementById('custNameInput').value.trim();
            const item = document.getElementById('itemName').value;
            const detail = document.getElementById('itemDetail').value.trim();
            const qty = parseFloat(document.getElementById('itemQty').value) || 0;
            const price = parseFloat(document.getElementById('itemPrice').value) || 0;
            
            if(name) document.getElementById('displayCustName').innerText = name;
            
            if(item && qty > 0 && price > 0) {
                let total = qty * price;
                subTotal += total;
                
                let itemDisplayName = detail ? `${item} (${detail})` : item;

                cartItems.push({ item: itemDisplayName, qty, price, total });

                document.getElementById('cartTable').innerHTML += `<tr><td class="text-right px-1">${itemDisplayName}</td><td>${qty}</td><td>${price}</td><td>${total}</td></tr>`;
                document.getElementById('subTotalDisplay').innerText = subTotal;
                
                document.getElementById('itemName').value = "";
                document.getElementById('itemDetail').value = "";
                document.getElementById('itemQty').value = "";
                document.getElementById('itemPrice').value = "";

                calculateTotal();
            } else {
                alert("براہ کرم آئٹم، تعداد اور قیمت درست منتخب/درج کریں۔");
            }
        }

        function calculateTotal() {
            const prev = parseFloat(document.getElementById('prevBalance').value) || 0;
            const paid = parseFloat(document.getElementById('paidAmount').value) || 0;
            document.getElementById('prevBalanceDisplay').innerText = prev;
            document.getElementById('paidAmountDisplay').innerText = paid;
            document.getElementById('grandTotal').innerText = (subTotal + prev) - paid;
        }

        async function saveBillToFirebase() {
            const customerName = document.getElementById('custNameInput').value.trim();
            if(!customerName || cartItems.length === 0) {
                alert("براہ کرم کسٹمر کا نام اور کم از کم ایک آئٹم شامل کریں۔");
                return;
            }

            const prevBalance = parseFloat(document.getElementById('prevBalance').value) || 0;
            const paidAmount = parseFloat(document.getElementById('paidAmount').value) || 0;
            const grandTotal = (subTotal + prevBalance) - paidAmount;

            const now = new Date();
            const dateStr = now.toLocaleDateString('en-GB');

            const billData = {
                customerName: customerName,
                items: cartItems,
                subTotal: subTotal,
                prevBalance: prevBalance,
                paidAmount: paidAmount,
                grandTotal: grandTotal,
                timestamp: now.toISOString(),
                date: dateStr
            };

            try {
                const newBillRef = window.push(window.ref(window.db, 'bills'));
                await window.set(newBillRef, billData);

                await window.set(window.ref(window.db, 'customers/' + customerName), {
                    lastBalance: grandTotal,
                    updatedAt: now.toISOString()
                });

                alert("بل کامیابی سے فائر بیس پر محفوظ ہو گیا ہے!");
                resetForm();
            } catch (error) {
                console.error("Firebase Error: ", error);
                alert("ڈیٹا محفوظ کرتے وقت خرابی پیش آئی: " + error.message);
            }
        }

        async function fetchCustomerPreviousBalance() {
            const customerName = document.getElementById('custNameInput').value.trim();
            if(!customerName) return;

            try {
                const snapshot = await window.get(window.child(window.dbRef, `customers/${customerName}`));
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    document.getElementById('prevBalance').value = data.lastBalance || 0;
                    calculateTotal();
                }
            } catch (error) {
                console.error("Error fetching balance:", error);
            }
        }

        function loadBillsFromFirebase() {
            const billsRef = window.ref(window.db, 'bills');
            window.onValue(billsRef, (snapshot) => {
                const data = snapshot.val();
                allBillsData = [];

                if (data) {
                    Object.keys(data).reverse().forEach(key => {
                        const bill = data[key];
                        allBillsData.push(bill);
                    });
                    renderReportsTable(allBillsData);
                } else {
                    renderReportsTable([]);
                }
            });
        }

        function renderReportsTable(bills) {
            const tbody = document.getElementById('reportsTable');
            tbody.innerHTML = "";

            let totalSalesSum = 0;
            let totalPaidSum = 0;

            if(bills.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-2 text-gray-500">کوئی بل نہیں ملا</td></tr>`;
                document.getElementById('totalSalesDisplay').innerText = "Rs. 0";
                document.getElementById('totalPaidDisplay').innerText = "Rs. 0";
                return;
            }

            bills.forEach((bill) => {
                const saleAmount = bill.subTotal || 0;
                const paidAmt = bill.paidAmount || 0;

                totalSalesSum += saleAmount;
                totalPaidSum += paidAmt;

                const itemsSummary = bill.items ? bill.items.map(i => `${i.item} (${i.qty} x ${i.price} = ${i.total})`).join('\n') : '';
                
                tbody.innerHTML += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-2">${bill.date || '-'}</td>
                        <td class="p-2 font-bold">${bill.customerName}</td>
                        <td class="p-2 text-green-700 font-bold">${saleAmount}</td>
                        <td class="p-2 text-red-600 font-bold">${bill.grandTotal}</td>
                        <td class="p-2">
                            <button onclick="alert('بل کی تفصیلات:\\n\\nکسٹمر: ${bill.customerName}\\nتاریخ: ${bill.date}\\n\\nآئٹمز:\\n${itemsSummary}\\n\\nسب ٹوٹل (سیل): ${bill.subTotal}\\nسابقہ بقایا: ${bill.prevBalance}\\nجمع شدہ: ${bill.paidAmount}\\nٹوٹل بقایا: ${bill.grandTotal}')" class="bg-blue-500 text-white px-2 py-1 rounded text-xs">تفصیل</button>
                        </td>
                    </tr>
                `;
            });

            document.getElementById('totalSalesDisplay').innerText = "Rs. " + totalSalesSum.toLocaleString();
            document.getElementById('totalPaidDisplay').innerText = "Rs. " + totalPaidSum.toLocaleString();
        }

        function filterBills() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allBillsData.filter(bill => 
                bill.customerName.toLowerCase().includes(query) || (bill.date && bill.date.includes(query))
            );
            renderReportsTable(filtered);
        }

        function resetForm() {
            subTotal = 0;
            cartItems = [];
            document.getElementById('cartTable').innerHTML = "";
            document.getElementById('subTotalDisplay').innerText = "0";
            document.getElementById('prevBalanceDisplay').innerText = "0";
            document.getElementById('paidAmountDisplay').innerText = "0";
            document.getElementById('grandTotal').innerText = "0";
            document.getElementById('custNameInput').value = "";
            document.getElementById('itemDetail').value = "";
            document.getElementById('prevBalance').value = "";
            document.getElementById('paidAmount').value = "";
            document.getElementById('displayCustName').innerText = "-------";
        }

        function downloadBillImage() {
            html2canvas(document.getElementById('bill-container')).then(c => {
                const link = document.createElement('a');
                link.download = 'New-Qari-Hosiery-Bill.png';
                link.href = c.toDataURL("image/png");
                link.click();
            });
        }
    </script>
</body>
</html>
